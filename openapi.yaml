openapi: 3.0.3
info:
  title: DBI API
  version: 1.0.0
  description: API for the database importer backend.
servers:
  - url: /api/v1
paths:
  /healthz:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /readyz:
    get:
      summary: Readiness check
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessResponse'
  /tables:
    get:
      summary: List tables
      responses:
        '200':
          description: Tables retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TablesResponse'
  /user:
    get:
      summary: Retrieve authenticated user information
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
  /table/{schemaName}/{tableName}:
    get:
      summary: Retrieve table columns
      parameters:
        - in: path
          name: schemaName
          required: true
          schema:
            type: string
        - in: path
          name: tableName
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Columns retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ColumnsResponse'
    post:
      summary: Preview import rows
      parameters:
        - in: path
          name: schemaName
          required: true
          schema:
            type: string
        - in: path
          name: tableName
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Preview succeeded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: Validation or import preview error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    put:
      summary: Commit import rows
      parameters:
        - in: path
          name: schemaName
          required: true
          schema:
            type: string
        - in: path
          name: tableName
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportRequest'
      responses:
        '200':
          description: Import committed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportResponse'
        '400':
          description: Validation or import error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
      required:
        - success
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ok
            uptime:
              type: number
            timestamp:
              type: string
              format: date-time
    ReadinessResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      properties:
        data:
          type: object
          properties:
            status:
              type: string
              example: ready
            checks:
              type: object
              properties:
                database:
                  type: boolean
            timestamp:
              type: string
              format: date-time
    TablesResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      properties:
        data:
          type: array
          items:
            type: object
    UserResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      properties:
        data:
          type: object
          properties:
            name:
              type: string
            databaseName:
              type: string
            isAuthorized:
              type: boolean
    ColumnsResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      properties:
        data:
          type: array
          items:
            type: object
    ImportRequest:
      type: object
      properties:
        rows:
          type: array
          items:
            type: object
    ImportResponse:
      allOf:
        - $ref: '#/components/schemas/SuccessResponse'
      properties:
        data:
          type: object
          properties:
            rowsInserted:
              type: integer
    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            message:
              type: string
            details:
              type: object
