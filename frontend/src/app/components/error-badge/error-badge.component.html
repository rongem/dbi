<button class="error-sign"
  (click)="visibleText = !visibleText"
  [attr.aria-expanded]="visibleText"
  i18n-aria-label aria-label="Show row error details">!</button>
<span class="visually-hidden" i18n>
    This line contains data causing errors.
</span>
@if (visibleText) {
  <div class="error position-absolute">
    {{errorDescription()}}
  </div>
}
