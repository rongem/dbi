<header class="toolbar" role="banner">
  <span>{{headerText()}}</span>
  <span>
    <ng-container i18n>
      Database-Importer v
    </ng-container>
    {{version}}
  </span>
  <div class="spacer"></div>
  <div id="username">
    {{authenticatedUser()}}
  </div>
</header>

@if (!notAuthorized()) {
  <main class="content" role="main" id="main-content">
    <router-outlet></router-outlet>
  </main>
}

<footer>
  @if (notAuthorized()) {
    <div class="backdrop" role="presentation"></div>
    <div class="busy" role="alert" i18n>
      You don't have sufficient rights to import into database.
    </div>
  }
</footer>

<app-toast-host></app-toast-host>

@if (busy()) {
  <div class="backdrop" role="presentation"></div>
  <div class="busy" role="status" aria-live="polite" i18n>Working...</div>
}
